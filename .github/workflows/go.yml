name: Go

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_REGISTRY: kellerman81
  IMAGE_NAME: go_media_downloader

jobs:

  build:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.version.outputs.VERSION }}
      IS_RELEASE: ${{ steps.version.outputs.IS_RELEASE }}
      GITHASH: ${{ steps.version.outputs.GITHASH }}
      DATE: ${{ steps.version.outputs.DATE }}

    # Builds inside the Docker builder image so the binaries link against the
    # same glibc as the runtime image (bookworm), which then uses them as-is.
    container: golang:1.26.10-bookworm

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install cross-compilation tools
      run: |
        apt-get update
        apt-get install -y zip gcc-aarch64-linux-gnu gcc-mingw-w64 gcc-arm-linux-gnueabihf

    # Only a pushed tag is a release version; everything else is a dev build.
    # (git describe would name it after the previous tag, e.g. v1.4.0-12-gabc.)
    - name: Get version and metadata
      id: version
      run: |
        GITHASH=$(echo "$GITHUB_SHA" | cut -c1-7)
        if [ "$GITHUB_REF_TYPE" = "tag" ]; then
          VERSION="$GITHUB_REF_NAME"
          IS_RELEASE=true
        else
          VERSION="dev-$GITHASH"
          IS_RELEASE=false
        fi

        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
        echo "IS_RELEASE=$IS_RELEASE" >> $GITHUB_OUTPUT
        echo "GITHASH=$GITHASH" >> $GITHUB_OUTPUT

    # Regenerates docs/swagger.json + .yaml from the code annotations, so the
    # packages and the image ship docs matching the code (docs/index.html loads them).
    - name: Generate Swagger docs
      run: |
        go install github.com/swaggo/swag/cmd/swag@v1.16.4
        make swagger

    - name: Build binaries
      env:
        VERSION: ${{ steps.version.outputs.VERSION }}
        GITHASH: ${{ steps.version.outputs.GITHASH }}
        BUILD_DATE: ${{ steps.version.outputs.DATE }}
      run: make build-all
    
    - name: Create release packages
      run: |
        # Create packages directory
        mkdir -p packages
        
        # Windows x64
        cp go_media_downloader-windows-amd64.exe go_media_downloader.exe
        cp init_imdb-windows-amd64.exe init_imdb.exe
        zip -r packages/gomedia-windows-x64.zip . \
          -x "*.git*" ".github/*" "pkg/*" "Dockerfile*" "go.*" "*.zip" "*.go" \
             "go_media_downloader-*" "init_imdb-*" "packages/*"
        rm go_media_downloader.exe init_imdb.exe
        
        # Linux x64
        cp go_media_downloader-linux-amd64 go_media_downloader
        cp init_imdb-linux-amd64 init_imdb
        zip -r packages/gomedia-linux-x64.zip . \
          -x "*.git*" ".github/*" "pkg/*" "Dockerfile*" "go.*" "*.zip" "*.go" \
             "go_media_downloader-*" "init_imdb-*" "packages/*"
        rm go_media_downloader init_imdb
        
        # Linux ARM64
        cp go_media_downloader-linux-arm64 go_media_downloader
        cp init_imdb-linux-arm64 init_imdb
        zip -r packages/gomedia-linux-arm64.zip . \
          -x "*.git*" ".github/*" "pkg/*" "Dockerfile*" "go.*" "*.zip" "*.go" \
             "go_media_downloader-*" "init_imdb-*" "packages/*"
        rm go_media_downloader init_imdb
        
        # Linux ARM7
        cp go_media_downloader-linux-arm7 go_media_downloader
        cp init_imdb-linux-arm7 init_imdb
        zip -r packages/gomedia-linux-arm7.zip . \
          -x "*.git*" ".github/*" "pkg/*" "Dockerfile*" "go.*" "*.zip" "*.go" \
             "go_media_downloader-*" "init_imdb-*" "packages/*"
        rm go_media_downloader init_imdb
    
    - name: Upload release packages
      uses: actions/upload-artifact@v4
      with:
        name: release-packages
        path: packages/
        retention-days: 5

    - name: Upload Linux binaries and docs for the Docker image
      uses: actions/upload-artifact@v4
      with:
        name: docker-files
        path: |
          go_media_downloader-linux-amd64
          go_media_downloader-linux-arm64
          init_imdb-linux-amd64
          init_imdb-linux-arm64
          docs/swagger.json
          docs/swagger.yaml
          docs/swagger.js
        retention-days: 1
  
  docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Overwrites the checked-out docs/swagger.* with the generated ones.
    - name: Download Linux binaries and docs
      uses: actions/download-artifact@v4
      with:
        name: docker-files

    # Still needed: the runtime stage's RUN steps execute per platform.
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ env.DOCKER_REGISTRY }}
        password: ${{ secrets.DOCKER }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=latest
          type=raw,value=${{ needs.build.outputs.VERSION }},enable=${{ needs.build.outputs.IS_RELEASE == 'true' }}
        labels: |
          org.opencontainers.image.title=${{ env.IMAGE_NAME }}
          org.opencontainers.image.description=Go Media Downloader
          org.opencontainers.image.version=${{ needs.build.outputs.VERSION }}
          org.opencontainers.image.revision=${{ needs.build.outputs.GITHASH }}
          org.opencontainers.image.created=${{ needs.build.outputs.DATE }}
    
    - name: Build and push multi-arch Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BINARIES=prebuilt
          VERSION=${{ needs.build.outputs.VERSION }}
          GITHASH=${{ needs.build.outputs.GITHASH }}
          BUILD_DATE=${{ needs.build.outputs.DATE }}

    - name: Logout from Docker Hub
      run: docker logout
  
  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: release-packages
        path: packages

    # Releases the pushed tag itself; a tag with a suffix (v1.5.0-rc1) is a prerelease.
    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        prerelease: ${{ contains(github.ref_name, '-') }}
        generate_release_notes: true
        files: packages/*
