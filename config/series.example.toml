# Series manual configuration - referenced by a [[lists]] entry with
# type = "seriesconfig" and manual_config_file = "./config/series.toml".
# Every series is one [[config]] table.

[[config]]
name = "Battlestar Galactica 2003"              # primary name of the series
alternatename = ["Battlestar Galactica (2003)"] # alternate names; TVDB/Trakt alternates are added on import
disallowedname = []                             # names that must not match this series
tvdb_id = 73545                                 # required unless source = "none"
source = "tvdb"                                 # tvdb, scraper or none (manage episodes yourself)
target = ""                                     # optional own library path (must be a configured path)
# The following settings apply to the initial import only - change them in the database afterwards.
identifiedby = "ep"                             # ep (S01E01) or date (daily shows)
dont_upgrade = false                            # true: no upgrade searches
dont_search = false                             # true: no searches at all
search_specials = false                         # true: also search season 0
ignore_runtime = false                          # true: skip the episode runtime check on import
