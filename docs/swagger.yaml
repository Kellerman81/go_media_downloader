      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Queued as a background job
          schema:
            $ref: '#/definitions/api.Jsonstarted'
        "400":
          description: Invalid id
          schema:
            $ref: '#/definitions/api.Jsonbadrequest'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
        "404":
          description: No media group has this entry
          schema:
            $ref: '#/definitions/api.Jsonnotfound'
        "409":
          description: The job is already queued
          schema:
            $ref: '#/definitions/api.Jsonconflict'
        "500":
          description: The job could not be queued
          schema:
            $ref: '#/definitions/api.Jsonservererror'
      summary: Rewrite the audio tags of one album
      tags:
      - music · tags
  /api/music/tag/all:
    get:
      description: Queues rewriting the audio tags of every album of every music media
        group from the stored metadata. Returns immediately; the work runs in the
        job queue.
      parameters:
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Queued as a background job; 'Nothing Done' when no configuration
            started it
          schema:
            $ref: '#/definitions/api.Jsonstarted'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
        "404":
          description: No configuration of this media type
          schema:
            $ref: '#/definitions/api.Jsonnotfound'
        "409":
          description: The job is already queued
          schema:
            $ref: '#/definitions/api.Jsonconflict'
        "500":
          description: The job could not be queued
          schema:
            $ref: '#/definitions/api.Jsonservererror'
      summary: Rewrite the audio tags of all albums
      tags:
      - music · tags
  /api/music/tag/artist/{id}:
    get:
      description: Queues rewriting the audio tags of all albums of one artist from
        the stored metadata. Returns immediately; the work runs in the job queue.
      parameters:
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      - description: ID of the artist in the dbartists table
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: Queued as a background job
          schema:
            $ref: '#/definitions/api.Jsonstarted'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
        "404":
          description: No media group has this entry
          schema:
            $ref: '#/definitions/api.Jsonnotfound'
        "409":
          description: The job is already queued
          schema:
            $ref: '#/definitions/api.Jsonconflict'
        "500":
          description: The job could not be queued
          schema:
            $ref: '#/definitions/api.Jsonservererror'
      summary: Rewrite the audio tags of an artist's albums
      tags:
      - music · tags
  /api/naming:
    post:
      description: Renders the folder and file name the organizer would use for a
        movie or series episode of the database, with the media group's naming template
        and a sample file path. Nothing is moved.
      parameters:
      - description: Media group, file path and movie or series ID to build the folder
          and file name for
        in: body
        name: config
        required: true
        schema:
          $ref: '#/definitions/api.apiNameInput'
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Parsed file and the generated folder and file name
          schema:
            $ref: '#/definitions/api.JSONNaming'
        "400":
          description: Media, group or organizer not found, or the file could not
            be parsed
          schema:
            $ref: '#/definitions/api.Jsonbadrequest'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
      summary: Test the naming template
      tags:
      - organize
  /api/parse/file:
    post:
      description: Like /api/parse/string, but also reads the file with ffprobe/mediainfo
        (resolution, codecs, runtime, languages) before computing the quality priority
        and looking up the database IDs. The path must exist on the server. Returns
        the parse result.
      parameters:
      - description: Release name or file path to parse, and the media group whose
          settings are used
        in: body
        name: toparse
        required: true
        schema:
          $ref: '#/definitions/api.apiparse'
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Parsed release information
          schema:
            allOf:
            - $ref: '#/definitions/api.Jsondata'
            - properties:
                data:
                  $ref: '#/definitions/database.ParseInfo'
              type: object
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
      summary: Parse a file including media info
      tags:
      - parse
  /api/parse/string:
    post:
      description: Parses a release or file name like the importer does (title, year,
        IDs, resolution, quality, codec, audio, ...), computes the quality priority
        for the given quality profile and looks up the matching database IDs. Returns
        the parse result and an error, if any. Movies and series only.
      parameters:
      - description: Release name or file path to parse, and the media group whose
          settings are used
        in: body
        name: toparse
        required: true
        schema:
          $ref: '#/definitions/api.apiparse'
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Parsed release information
          schema:
            allOf:
            - $ref: '#/definitions/api.Jsondataerror'
            - properties:
                data:
                  $ref: '#/definitions/database.ParseInfo'
              type: object
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
      summary: Parse a release name
      tags:
      - parse
  /api/quality:
    get:
      description: 'Returns all rows of the qualities table: the resolution, quality,
        codec and audio patterns (strings or regex) the parser uses, with their priorities.'
      parameters:
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: All quality rows
          schema:
            allOf:
            - $ref: '#/definitions/api.Jsondata'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/database.Qualities'
                  type: array
              type: object
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
      summary: List quality patterns
      tags:
      - quality
    post:
      description: Inserts the quality pattern when its id is 0 or unknown, otherwise
        updates it; then reloads the patterns. Returns the updated qualities list.
      parameters:
      - description: Quality row to save; an ID that does not exist yet creates a
          new row
        in: body
        name: quality
        required: true
        schema:
          $ref: '#/definitions/database.Qualities'
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: All quality rows after the change
          schema:
            allOf:
            - $ref: '#/definitions/api.Jsondata'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/database.Qualities'
                  type: array
              type: object
        "400":
          description: Save failed
          schema:
            $ref: '#/definitions/api.Jsonbadrequest'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
      summary: Add or update a quality pattern
      tags:
      - quality
  /api/quality/{id}:
    delete:
      description: Deletes one row of the qualities table, reloads the patterns and
        returns the remaining qualities.
      parameters:
      - description: ID of the qualities row
        in: path
        name: id
        required: true
        type: string
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: The remaining quality rows
          schema:
            allOf:
            - $ref: '#/definitions/api.Jsondata'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/database.Qualities'
                  type: array
              type: object
        "400":
          description: Delete failed
          schema:
            $ref: '#/definitions/api.Jsonbadrequest'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
      summary: Delete a quality pattern
      tags:
      - quality
  /api/quality/all:
    get:
      description: Returns the computed priorities of the wanted combinations of every
        quality profile.
      parameters:
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Priorities of all quality profiles
          schema:
            allOf:
            - $ref: '#/definitions/api.Jsondata'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/parser.Prioarr'
                  type: array
              type: object
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
      summary: Wanted quality priorities of all profiles
      tags:
      - quality
  /api/quality/complete:
    get:
      description: Returns the computed priorities of every resolution/quality/codec/audio
        combination of every quality profile, including the unwanted ones.
      parameters:
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Every combination with its priority
          schema:
            allOf:
            - $ref: '#/definitions/api.Jsondata'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/parser.Prioarr'
                  type: array
              type: object
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
      summary: All quality priorities of all profiles
      tags:
      - quality
  /api/quality/get/{name}:
    get:
      description: Returns the computed priorities of all wanted resolution/quality/codec/audio
        combinations of one quality profile - the order releases are preferred in.
      parameters:
      - description: Quality profile name, e.g. SD
        in: path
        name: name
        required: true
        type: string
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Priorities of the quality profile
          schema:
            allOf:
            - $ref: '#/definitions/api.Jsondata'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/parser.Prioarr'
                  type: array
              type: object
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
        "404":
          description: Quality profile not found
          schema:
            $ref: '#/definitions/api.Jsonnotfound'
      summary: Wanted quality priorities of a profile
      tags:
      - quality
  /api/queue:
    get:
      description: Returns the jobs that are waiting in the queues or currently running
        (not the finished ones), keyed by queue ID.
      parameters:
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Queued and running jobs keyed by queue ID
          schema:
            allOf:
            - $ref: '#/definitions/api.Jsondata'
            - properties:
                data:
                  additionalProperties:
                    $ref: '#/definitions/syncops.Job'
                  type: object
              type: object
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
      summary: List queued and running jobs
      tags:
      - queue
  /api/queue/cancel/{id}:
    delete:
      description: Cancels one job of the queue (IDs from /api/queue) and removes
        it; a running job is told to stop.
      parameters:
      - description: Queue job ID
        in: path
        name: id
        required: true
        type: string
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Canceled
          schema:
            $ref: '#/definitions/api.Jsonsuccessmessage'
        "400":
          description: Missing or invalid queue ID
          schema:
            $ref: '#/definitions/api.Jsonbadrequest'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
        "404":
          description: '{''success'':false,''error'':''Queue job not found''}'
          schema:
            $ref: '#/definitions/api.Jsonoperation'
      summary: Cancel a queued or running job
      tags:
      - queue
  /api/queue/history:
    get:
      description: Returns the job history from the job_histories table (job, media
        group, list, start and end time), newest first, 100 rows by default.
      parameters:
      - description: Number of rows (default 100)
        in: query
        name: limit
        type: integer
      - description: Page number, starting at 1
        in: query
        name: page
        type: integer
      - description: SQL order, default 'ID desc'
        in: query
        name: order
        type: string
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Job history rows, newest first
          schema:
            allOf:
            - $ref: '#/definitions/api.Jsondata'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/database.JobHistory'
                  type: array
              type: object
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
      summary: Job history
      tags:
      - queue
  /api/scheduler/list:
    get:
      description: 'Returns all schedules keyed by ID: job name, media group, interval
        or cron expression, queue, last and next run, and whether it is running or
        paused.'
      parameters:
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Schedules keyed by ID
          schema:
            allOf:
            - $ref: '#/definitions/api.Jsondata'
            - properties:
                data:
                  additionalProperties:
                    $ref: '#/definitions/syncops.JobSchedule'
                  type: object
              type: object
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
      summary: List schedules
      tags:
      - scheduler
  /api/scheduler/queue/{id}:
    post:
      description: Queues one run of the schedule's job now, also for a paused schedule.
        Returns 409 when the job is already queued or running.
      parameters:
      - description: ID of the schedule, as returned by /api/scheduler/list
        in: path
        name: id
        required: true
        type: string
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Finished
          schema:
            $ref: '#/definitions/api.Jsonok'
        "400":
          description: Invalid schedule ID format
          schema:
            $ref: '#/definitions/api.Jsonbadrequest'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
        "404":
          description: Schedule not found
          schema:
            $ref: '#/definitions/api.Jsonnotfound'
        "409":
          description: Job is already queued or running
          schema:
            $ref: '#/definitions/api.Jsonconflict'
      summary: Run one schedule now
      tags:
      - scheduler
  /api/scheduler/start:
    get:
      description: Starts the scheduler again after /api/scheduler/stop.
      parameters:
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Finished
          schema:
            $ref: '#/definitions/api.Jsonok'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
      summary: Start the scheduler
      tags:
      - scheduler
  /api/scheduler/start/{id}:
    post:
      description: Resumes a schedule paused with /api/scheduler/stop/{id}.
      parameters:
      - description: ID of the schedule, as returned by /api/scheduler/list
        in: path
        name: id
        required: true
        type: string
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Finished
          schema:
            $ref: '#/definitions/api.Jsonok'
        "400":
          description: Invalid schedule ID format
          schema:
            $ref: '#/definitions/api.Jsonbadrequest'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
        "404":
          description: Schedule not found
          schema:
            $ref: '#/definitions/api.Jsonnotfound'
      summary: Resume one schedule
      tags:
      - scheduler
  /api/scheduler/stop:
    get:
      description: 'Stops the scheduler: no scheduled jobs are queued until it is
        started again. Jobs that are already queued or running continue.'
      parameters:
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Finished
          schema:
            $ref: '#/definitions/api.Jsonok'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
      summary: Stop the scheduler
      tags:
      - scheduler
  /api/scheduler/stop/{id}:
    post:
      description: 'Pauses one schedule: it queues no jobs until it is started again.
        In memory only - a restart or scheduler reload starts it again. Schedule IDs
        come from /api/scheduler/list.'
      parameters:
      - description: ID of the schedule, as returned by /api/scheduler/list
        in: path
        name: id
        required: true
        type: string
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Finished
          schema:
            $ref: '#/definitions/api.Jsonok'
        "400":
          description: Invalid schedule ID format
          schema:
            $ref: '#/definitions/api.Jsonbadrequest'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
        "404":
          description: Schedule not found
          schema:
            $ref: '#/definitions/api.Jsonnotfound'
      summary: Pause one schedule
      tags:
      - scheduler
  /api/series:
    get:
      description: Returns the series of the dbseries table - one row per series with
        its metadata, independent of lists - paginated, with the total count.
      parameters:
      - description: Rows per page; without it all rows are returned
        in: query
        name: limit
        type: integer
      - description: Page number, starting at 1; only used together with limit
        in: query
        name: page
