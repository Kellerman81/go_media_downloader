        the scheduler and workers are paused during the backup. The request waits
        until it is done.
      parameters:
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Finished
          schema:
            $ref: '#/definitions/api.Jsonok'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
        "403":
          description: Database error
          schema:
            $ref: '#/definitions/api.Jsonforbidden'
      summary: Back up the database
      tags:
      - database
  /api/db/cleanuporphans:
    get:
      description: Deletes child rows whose parent rows no longer exist, following
        the schema's foreign keys (e.g. files of deleted list entries). Returns the
        number of deleted rows per table.
      parameters:
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Deleted rows per table
          schema:
            allOf:
            - $ref: '#/definitions/api.Jsondata'
            - properties:
                data:
                  additionalProperties:
                    format: int64
                    type: integer
                  type: object
              type: object
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
        "500":
          description: Cleanup stopped early
          schema:
            $ref: '#/definitions/api.Jsonerror'
      summary: Delete orphaned rows
      tags:
      - database
  /api/db/clear/{name}:
    delete:
      description: Deletes every row of the given table and vacuums the database.
        Cannot be undone - make a backup first.
      parameters:
      - description: Table name, e.g. job_histories
        in: path
        name: name
        required: true
        type: string
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Finished
          schema:
            $ref: '#/definitions/api.Jsonok'
        "400":
          description: Unknown table
          schema:
            $ref: '#/definitions/api.Jsonbadrequest'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
        "403":
          description: Database error
          schema:
            $ref: '#/definitions/api.Jsonforbidden'
      summary: Delete all rows of a table
      tags:
      - database
  /api/db/clearcache:
    delete:
      description: Clears all in-memory caches (titles, IDs, files, histories). They
        are rebuilt on the next use or cache refresh.
      parameters:
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Finished
          schema:
            $ref: '#/definitions/api.Jsonok'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
      summary: Clear the in-memory caches
      tags:
      - cache
  /api/db/delete/{name}/{id}:
