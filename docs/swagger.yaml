  config.DownloaderConfig:
    properties:
      AddPaused:
        description: AddPaused specifies whether to add entries in paused state
        type: boolean
      DelugeDlTo:
        description: DelugeDlTo is the Deluge target for downloads
        type: string
      DelugeMoveAfter:
        description: DelugeMoveAfter specifies if downloads should be moved after
          completion in Deluge
        type: boolean
      DelugeMoveTo:
        description: DelugeMoveTo is the Deluge target for downloads after completion
        type: string
      DlType:
        description: DlType is the type of downloader, e.g. drone, nzbget, etc.
        type: string
      Enabled:
        description: Enabled specifies if this template is active
        type: boolean
      Hostname:
        description: Hostname is the hostname to use if needed
        type: string
      Name:
        description: Name is the name of the downloader template
        type: string
      Password:
        description: Password is the password to use if needed
        type: string
      Port:
        description: Port is the port to use if needed
        type: integer
      Priority:
        description: Priority is the priority to set if needed
        type: integer
      RemoveFailed:
        description: RemoveFailed removes a download the client reports as failed
        type: boolean
      Username:
        description: Username is the username to use if needed
        type: string
    type: object
  config.GeneralConfig:
    properties:
      AcoustIDAPIKey:
        description: AcoustIDAPIKey is the API key for AcoustID audio fingerprint
          lookups
        type: string
      AcoustIDLimiterCalls:
        description: 'AcoustIDLimiterCalls defines calls limit for AcoustID API in
          defined seconds - default: 3'
        type: integer
      AcoustIDLimiterSeconds:
        description: 'AcoustIDLimiterSeconds defines seconds limit for AcoustID API
          calls - default: 1'
        type: integer
      AudibleLimiterCalls:
        description: AudibleLimiterCalls defines calls limit for Audible API in defined
          seconds - 0 = built-in 1
        type: integer
      AudibleLimiterSeconds:
        description: AudibleLimiterSeconds defines seconds limit for Audible API calls
          - 0 = built-in 2
        type: integer
      AudnexLimiterCalls:
        description: 'AudnexLimiterCalls defines calls limit for Audnex API in defined
          seconds - default: 10'
        type: integer
      AudnexLimiterSeconds:
        description: 'AudnexLimiterSeconds defines seconds limit for Audnex API calls
          - default: 1'
        type: integer
      CacheAutoExtend:
        description: 'CacheAutoExtend defines whether cache expiration will be reset
          on access - default: false'
        type: boolean
      CacheDuration:
        description: 'CacheDuration defines hours after which cached data will be
          refreshed - default: 12'
        type: integer
      CacheDuration2:
        type: integer
      DBLogLevel:
        description: 'DBLogLevel defines the database log level to use, options are
          info or debug (not recommended) - default: info'
        type: string
      DatabaseBackupStopTasks:
        description: DatabaseBackupStopTasks specifies whether to stop background
          tasks during database backups
        type: boolean
      DeezerLimiterCalls:
        description: 'DeezerLimiterCalls defines calls limit for Deezer API in defined
          seconds - default: 50'
        type: integer
      DeezerLimiterSeconds:
        description: 'DeezerLimiterSeconds defines seconds limit for Deezer API calls
          - default: 5'
        type: integer
      DisableParserStringMatch:
        description: 'DisableParserStringMatch defines whether to disable string matching
          in parsers - default: false'
        type: boolean
      DiscogsLimiterCalls:
        description: 'DiscogsLimiterCalls defines calls limit for Discogs API in defined
          seconds - default: 60'
        type: integer
      DiscogsLimiterSeconds:
        description: 'DiscogsLimiterSeconds defines seconds limit for Discogs API
          calls - default: 60'
        type: integer
      DiscogsToken:
        description: DiscogsToken is the personal access token for Discogs API
        type: string
      EnableFileWatcher:
        description: |-
          UseGoDir                           bool     `toml:"use_godir"`
          ConcurrentScheduler                int      `toml:"concurrent_scheduler"`
          EnableFileWatcher specifies whether the file watcher functionality is enabled
          When set to true, the application will monitor specified directories for file changes
          Default is false
        type: boolean
      FailedIndexerBlockTime:
        description: FailedIndexerBlockTime specifies how long in minutes an indexer
          should be blocked after failures
        type: integer
      FfprobePath:
        description: |-
          FfprobePath specifies the folder containing the ffprobe executable
          Used for media analysis
        type: string
      FpcalcPath:
        description: FpcalcPath specifies the path to the fpcalc executable for audio
          fingerprinting
        type: string
      GoodreadsAPIKey:
        description: GoodreadsAPIKey is the API key for Goodreads (deprecated but
          still partially functional)
        type: string
      GoodreadsLimiterCalls:
        description: 'GoodreadsLimiterCalls defines calls limit for Goodreads API
          in defined seconds - default: 1'
        type: integer
      GoodreadsLimiterSeconds:
        description: 'GoodreadsLimiterSeconds defines seconds limit for Goodreads
          API calls - default: 1'
        type: integer
      ITunesLimiterCalls:
        description: 'ITunesLimiterCalls defines calls limit for iTunes API in defined
          seconds - default: 20'
        type: integer
      ITunesLimiterSeconds:
        description: 'ITunesLimiterSeconds defines seconds limit for iTunes API calls
          - default: 60'
        type: integer
      JellyfinDisableTLSVerify:
        description: 'JellyfinDisableTLSVerify specifies whether to disable TLS certificate
          verification for Jellyfin API calls - default: false'
        type: boolean
      JellyfinLimiterCalls:
        description: 'JellyfinLimiterCalls defines calls limit for Jellyfin API in
          defined seconds - default: 10'
        type: integer
      JellyfinLimiterSeconds:
        description: 'JellyfinLimiterSeconds defines seconds limit for Jellyfin API
          calls - default: 1'
        type: integer
      JellyfinTimeoutSeconds:
        description: 'JellyfinTimeoutSeconds defines the HTTP timeout in seconds for
          Jellyfin API calls - default: 30'
        type: integer
      LastFMAPIKey:
        description: LastFMAPIKey is the API key for Last.fm - get one at https://www.last.fm/api/account/create
        type: string
      LastFMLimiterCalls:
        description: 'LastFMLimiterCalls defines calls limit for Last.fm API in defined
          seconds - default: 5'
        type: integer
      LastFMLimiterSeconds:
        description: 'LastFMLimiterSeconds defines seconds limit for Last.fm API calls
          - default: 1'
        type: integer
      LogColorize:
        description: 'LogColorize defines whether to use colors in console output
          - default: false'
        type: boolean
      LogCompress:
        description: 'LogCompress defines whether to compress old log files - default:
          false'
        type: boolean
      LogFileCount:
        description: 'LogFileCount defines how many log files to keep - default: 5'
        type: integer
      LogFileSize:
        description: 'LogFileSize defines the size in MB for the log files - default:
          5'
        type: integer
      LogLevel:
        description: 'LogLevel defines the log level to use, options are info or debug
          - default: info'
        type: string
      LogToFileOnly:
        description: 'LogToFileOnly defines whether to only log to file and not console
          - default: false'
        type: boolean
      MaxDatabaseBackups:
        description: MaxDatabaseBackups defines the maximum number of database backups
          to retain
        type: integer
      MediainfoPath:
        description: |-
          MediainfoPath specifies the folder containing the mediainfo executable
          Used as an alternative to ffprobe for media analysis
        type: string
      MetaflacPath:
        description: |-
          MetaflacPath specifies the path to the metaflac executable
          Used for writing FLAC audio file tags
        type: string
      MoveBufferSizeKB:
        description: 'MoveBufferSizeKB defines buffer size in KB to use if file buffer
          copy enabled - default: 1024'
        type: integer
      MovieAlternateTitleMetaSourceImdb:
        description: 'MovieAlternateTitleMetaSourceImdb defines whether to scan IMDB
          for alternate movie titles - default: false'
        type: boolean
      MovieAlternateTitleMetaSourceOmdb:
        description: 'MovieAlternateTitleMetaSourceOmdb defines whether to scan OMDB
          for alternate movie titles - default: false'
        type: boolean
      MovieAlternateTitleMetaSourceTmdb:
        description: 'MovieAlternateTitleMetaSourceTmdb defines whether to scan TMDb
          for alternate movie titles - default: false'
        type: boolean
      MovieAlternateTitleMetaSourceTrakt:
        description: 'MovieAlternateTitleMetaSourceTrakt defines whether to scan Trakt
          for alternate movie titles - default: false'
        type: boolean
      MovieMetaSourceImdb:
        description: 'MovieMetaSourceImdb defines whether to scan IMDB for movie metadata
          - default: false'
        type: boolean
      MovieMetaSourceOmdb:
        description: 'MovieMetaSourceOmdb defines whether to scan OMDB for movie metadata
          - default: false'
        type: boolean
      MovieMetaSourcePriority:
        description: MovieMetaSourcePriority defines priority order to scan metadata
          providers for movies - overrides individual settings
        items:
          type: string
        type: array
      MovieMetaSourceTmdb:
        description: 'MovieMetaSourceTmdb defines whether to scan TMDb for movie metadata
          - default: false'
        type: boolean
      MovieMetaSourceTrakt:
        description: 'MovieMetaSourceTrakt defines whether to scan Trakt for movie
          metadata - default: false'
        type: boolean
      MovieParseMetaSourcePriority:
        description: MovieParseMetaSourcePriority defines priority order to scan metadata
          providers for movie file parsing - overrides individual settings
        items:
          type: string
        type: array
      MovieRSSMetaSourcePriority:
        description: MovieRSSMetaSourcePriority defines priority order to scan metadata
          providers for movie RSS - overrides individual settings
        items:
          type: string
        type: array
      MusicBrainzLimiterCalls:
        description: 'MusicBrainzLimiterCalls defines calls limit for MusicBrainz
          API in defined seconds - default: 1'
        type: integer
      MusicBrainzLimiterSeconds:
        description: 'MusicBrainzLimiterSeconds defines seconds limit for MusicBrainz
          API calls - default: 1'
        type: integer
      MusicMetaSourcePenalties:
        additionalProperties:
          format: float64
          type: number
        description: |-
          MusicMetaSourcePenalties adds a fixed distance penalty for candidates from specific
          metadata providers. Keys are provider names (e.g. "discogs", "lastfm"), values are
          penalty amounts added to albumDistanceWithTracks before recommendation is evaluated.
          A positive value makes a provider's candidates harder to match; use 0.0 to disable.
          Example: {"discogs": 0.1} adds 0.10 to every Discogs candidate's distance score.
        type: object
      MusicMetaSourcePriority:
        description: |-
          MusicMetaSourcePriority controls which music metadata providers are active and in what order.
          An empty list enables all providers in the default order: musicbrainz → acoustid → lastfm → discogs → deezer.
          To disable a provider, omit it from the list.
          Note: removing 'musicbrainz' severely limits matching — it is the track-listing source
          for candidates not yet fully populated in the database.
        items:
          type: string
        type: array
      OmdbAPIKey:
        description: OmdbAPIKey is the API key for OMDB - get one at https://www.omdbapi.com/apikey.aspx
        type: string
      OmdbDisableTLSVerify:
        description: |-
          OmdbDisableTLSVerify disables TLS certificate verification for OMDb API requests
          Setting this to true may increase performance but reduces security
        type: boolean
      OmdbLimiterCalls:
        description: 'OmdbLimiterCalls defines calls limit for OMDb API in defined
          seconds - default: 1'
        type: integer
      OmdbLimiterSeconds:
