            $ref: '#/definitions/api.Jsonstarted'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
        "404":
          description: No media group has this entry
          schema:
            $ref: '#/definitions/api.Jsonnotfound'
        "409":
          description: The job is already queued
          schema:
            $ref: '#/definitions/api.Jsonconflict'
        "500":
          description: The job could not be queued
          schema:
            $ref: '#/definitions/api.Jsonservererror'
      summary: Refresh the metadata of one series
      tags:
      - series · jobs
  /api/series/rss/search/list/{group}:
    get:
      description: Reads the indexers' RSS feeds for one series media group and returns
        the accepted and denied releases. Nothing is downloaded.
      parameters:
      - description: Media group name without type prefix, e.g. EN
        in: path
        name: group
        required: true
        type: string
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Releases the indexers returned, split into accepted and denied
            with the reason
          schema:
            $ref: '#/definitions/api.Jsonresults'
        "204":
          description: Nothing Done - no media group or nothing to search (no body)
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
        "404":
          description: failed with <search error> (plain JSON string)
          schema:
            type: string
      summary: Preview the RSS search of a series group
      tags:
      - series · search
  /api/series/search/history/clear/{name}:
    get:
      description: Queues deleting the episode download history of a series media
        group (or of one of its lists), so releases can be downloaded again. Returns
        immediately; the work runs in the job queue.
      parameters:
      - description: Media group name, or the name of one of its lists (the whole
          group is processed)
        in: path
        name: name
        required: true
        type: string
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Queued as a background job
          schema:
            $ref: '#/definitions/api.Jsonstarted'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
        "404":
          description: Media group or list not found
          schema:
            $ref: '#/definitions/api.Jsonnotfound'
        "409":
          description: The job is already queued
          schema:
            $ref: '#/definitions/api.Jsonconflict'
        "500":
          description: The job could not be queued
          schema:
            $ref: '#/definitions/api.Jsonservererror'
      summary: Clear the download history of a group or list
      tags:
      - series · search
  /api/series/search/history/clearid/{id}:
    get:
      description: Deletes all download history rows of one episode list entry, so
        its releases can be downloaded again. Returns the number of deleted rows.
      parameters:
      - description: serie_episodes (list entry) ID
        in: path
        name: id
        required: true
        type: string
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Number of deleted history rows
          schema:
            $ref: '#/definitions/api.Jsoncount'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
        "403":
          description: Database error
          schema:
            $ref: '#/definitions/api.Jsonforbidden'
      summary: Clear the download history of an episode
      tags:
      - series · search
  /api/series/search/id/{id}:
    get:
      description: Queues a search of the indexers for every episode of one series
        list entry and downloads the best accepted release per episode. Returns immediately;
        the work runs in the job queue.
      parameters:
      - description: series (list entry) ID
        in: path
        name: id
        required: true
        type: integer
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Queued as a background job
          schema:
            $ref: '#/definitions/api.Jsonstarted'
        "204":
          description: Nothing Done - no media group or nothing to search (no body)
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
        "404":
          description: Series not found
          schema:
            $ref: '#/definitions/api.Jsonnotfound'
        "409":
          description: The job is already queued
          schema:
            $ref: '#/definitions/api.Jsonconflict'
        "500":
          description: The job could not be queued
          schema:
            $ref: '#/definitions/api.Jsonservererror'
      summary: Search all episodes of a series and download
      tags:
      - series · search
  /api/series/search/id/{id}/{season}:
    get:
      description: Queues a search of the indexers for every episode of one season
        of a series list entry and downloads accepted releases. Returns immediately;
        the work runs in the job queue.
      parameters:
      - description: series (list entry) ID
        in: path
        name: id
        required: true
        type: integer
      - description: Season number as stored for the series, e.g. 1 (0 for specials)
        in: path
        name: season
        required: true
        type: string
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Queued as a background job
          schema:
            $ref: '#/definitions/api.Jsonstarted'
        "204":
          description: Nothing Done - no media group or nothing to search (no body)
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
        "404":
          description: Series not found
          schema:
            $ref: '#/definitions/api.Jsonnotfound'
        "409":
          description: The job is already queued
          schema:
            $ref: '#/definitions/api.Jsonconflict'
        "500":
          description: The job could not be queued
          schema:
            $ref: '#/definitions/api.Jsonservererror'
      summary: Search the episodes of one season and download
      tags:
      - series · search
  /api/series/searchrss/id/{id}:
    get:
      description: Queues one indexer search by TVDB ID for the whole series (no season)
        and downloads accepted releases for its missing episodes and upgrades. Returns
        immediately; the work runs in the job queue.
      parameters:
      - description: series (list entry) ID
        in: path
        name: id
        required: true
        type: integer
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Queued as a background job
          schema:
            $ref: '#/definitions/api.Jsonstarted'
        "204":
          description: Nothing Done - no media group or nothing to search (no body)
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
        "404":
          description: Series not found
          schema:
            $ref: '#/definitions/api.Jsonnotfound'
        "409":
          description: The job is already queued
          schema:
            $ref: '#/definitions/api.Jsonconflict'
        "500":
          description: The job could not be queued
          schema:
            $ref: '#/definitions/api.Jsonservererror'
      summary: Search a series with one indexer call
      tags:
      - series · search
  /api/series/searchrss/id/{id}/{season}:
    get:
      description: Queues one indexer search by TVDB ID and season for a series list
        entry and downloads accepted releases, e.g. a season pack. Returns immediately;
        the work runs in the job queue.
      parameters:
      - description: series (list entry) ID
        in: path
        name: id
        required: true
        type: integer
      - description: Season number as stored for the series, e.g. 1 (0 for specials)
        in: path
        name: season
        required: true
        type: string
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Queued as a background job
          schema:
            $ref: '#/definitions/api.Jsonstarted'
        "204":
          description: Nothing Done - no media group or nothing to search (no body)
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
        "404":
          description: Series not found
          schema:
            $ref: '#/definitions/api.Jsonnotfound'
        "409":
          description: The job is already queued
          schema:
            $ref: '#/definitions/api.Jsonconflict'
        "500":
          description: The job could not be queued
          schema:
            $ref: '#/definitions/api.Jsonservererror'
      summary: Search one season with one indexer call
      tags:
      - series · search
  /api/series/searchrss/list/id/{id}:
    get:
      description: Searches the indexers once by TVDB ID for the whole series, downloads
        accepted releases, and returns the accepted and denied releases.
      parameters:
      - description: series (list entry) ID
        in: path
        name: id
        required: true
        type: integer
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Releases the indexers returned, split into accepted and denied
            with the reason
          schema:
            $ref: '#/definitions/api.Jsonresults'
        "204":
          description: Nothing Done - no media group or nothing to search (no body)
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
        "404":
          description: Series not found
          schema:
            $ref: '#/definitions/api.Jsonnotfound'
      summary: Search a series with one call and show the results
      tags:
      - series · search
  /api/series/searchrss/seasons/id/{id}:
    get:
      description: Queues one indexer search per season (by TVDB ID and season) for
        a series list entry and downloads accepted releases, e.g. season packs. Returns
        immediately; the work runs in the job queue.
      parameters:
      - description: series (list entry) ID
        in: path
        name: id
        required: true
        type: integer
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Queued as a background job
          schema:
            $ref: '#/definitions/api.Jsonstarted'
        "204":
          description: Nothing Done - no media group or nothing to search (no body)
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
        "404":
          description: Series not found
          schema:
            $ref: '#/definitions/api.Jsonnotfound'
        "409":
          description: The job is already queued
          schema:
            $ref: '#/definitions/api.Jsonconflict'
        "500":
          description: The job could not be queued
          schema:
            $ref: '#/definitions/api.Jsonservererror'
      summary: Search every season of a series
      tags:
      - series · search
  /api/series/unmatched:
    get:
      description: Returns the episode files the organizer could not match (serie_file_unmatcheds),
        paginated, with the total count.
      parameters:
      - description: Rows per page; without it all rows are returned
        in: query
        name: limit
        type: integer
      - description: Page number, starting at 1; only used together with limit
        in: query
        name: page
        type: integer
      - description: 'Sort order: column names with optional asc/desc, e.g. ''id desc''
          or ''year desc, title'''
        in: query
        name: order
        type: string
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: One page of rows and the total row count
          schema:
            allOf:
            - $ref: '#/definitions/api.Jsondatarows'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/database.SerieFileUnmatched'
                  type: array
              type: object
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
      summary: List unmatched episode files
      tags:
      - series · data
  /api/slug:
    get:
      description: Fills the slug columns of all tables that have one. By default
        only empty slugs are filled; force=true regenerates all of them.
      parameters:
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      - description: Set to 'true' to regenerate all slugs, not just empty ones
        in: query
        name: force
        type: string
      responses:
        "200":
          description: Finished
          schema:
            $ref: '#/definitions/api.Jsonok'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
      summary: Regenerate URL slugs
      tags:
      - database
  /api/statistics:
    get:
      description: 'Returns all statistics in one response: movies, series, music,
        books, audiobooks, storage, HTTP requests, workers and system. Gathered with
        a 30 second limit.'
      parameters:
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Statistics
          schema:
            $ref: '#/definitions/api.OverallStatistics'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
        "500":
          description: Query failed
          schema:
            $ref: '#/definitions/api.Jsonerror'
      summary: All statistics
      tags:
      - statistics
  /api/statistics/movies:
    get:
      description: 'Returns the movie library statistics: total, available and missing
        movies, quality reached, upgrades available, counts per quality and per list,
        and total size.'
      parameters:
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Statistics
          schema:
            $ref: '#/definitions/api.MovieStatistics'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
        "500":
          description: Query failed
          schema:
            $ref: '#/definitions/api.Jsonerror'
      summary: Movie statistics
      tags:
      - statistics
  /api/statistics/series:
    get:
      description: 'Returns the series library statistics: series, seasons and episodes
        (total, available, missing), quality reached, upgrades available, counts per
        quality and per list, and total size.'
      parameters:
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Statistics
          schema:
            $ref: '#/definitions/api.SeriesStatistics'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
        "500":
          description: Query failed
          schema:
            $ref: '#/definitions/api.Jsonerror'
      summary: Series statistics
      tags:
      - statistics
  /api/statistics/workers:
    get:
      description: Returns the statistics of the worker pools (queued, running and
        finished jobs per pool).
      parameters:
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Worker pool statistics
          schema:
            $ref: '#/definitions/worker.Stats'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
      summary: Worker statistics
      tags:
      - statistics
  /api/structure:
    post:
      description: 'Runs the organizer on one folder: parses and matches the files,
        then moves and renames them into the library of the given media group and
        path template (movies and series). Optionally forces a database ID and turns
        off the runtime check, the disallowed-name check or deleting wrong-language
        files.'
      parameters:
      - description: Folder to organize, the media group, and the source and target
          path entries
        in: body
        name: config
        required: true
        schema:
          $ref: '#/definitions/api.apiStructureJSON'
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Empty object {} - the organize run finished
          schema:
            type: object
        "400":
          description: Media group, path or folder not found
          schema:
            $ref: '#/definitions/api.Jsonbadrequest'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
      summary: Organize one folder
      tags:
      - organize
  /api/trakt/authorize:
    get:
      description: Returns the URL to open in a browser to authorize this application
        at Trakt. After approving, pass the shown code to /api/trakt/token/{code}.
      parameters:
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Trakt authorization URL to open in a browser; empty when Trakt
            is not set up
          schema:
            $ref: '#/definitions/api.Jsontraktauthurl'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
      summary: Get the Trakt authorization URL
      tags:
      - trakt
  /api/trakt/token/{code}:
    get:
      description: Exchanges the code from the Trakt authorization page for an access
        token, saves it (config/trakt_token.json) and returns the stored token.
      parameters:
      - description: Code shown by Trakt after authorizing
        in: path
        name: code
        required: true
        type: string
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: The stored token; data is null when Trakt is not set up
          schema:
            allOf:
            - $ref: '#/definitions/api.Jsondata'
            - properties:
                data:
                  $ref: '#/definitions/apiexternal_v2.OAuthToken'
              type: object
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
      summary: Store the Trakt authorization code
      tags:
      - trakt
  /api/trakt/user/{user}/{list}:
    get:
      description: Reads a Trakt user list with the stored token and returns the first
        10 entries (movies and shows) plus any error - a quick test of the Trakt authorization.
      parameters:
      - description: Trakt username (slug) that owns the list
        in: path
        name: user
        required: true
        type: string
      - description: Slug of the user's Trakt list
        in: path
        name: list
        required: true
        type: string
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: List items, and the error text if Trakt failed
          schema:
            allOf:
            - $ref: '#/definitions/api.Jsondataerror'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/trakt.TraktUserListItem'
                  type: array
              type: object
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
      summary: Read a Trakt user list (auth test)
      tags:
      - trakt
produces:
- application/json
schemes:
- http
- https
securityDefinitions:
  ApiKeyAuth:
    in: query
    name: apikey
    type: apiKey
swagger: "2.0"
tags:
- description: 'Jobs for every media group at once: list imports, library scans and
    searches.'
  name: all
- description: 'Movie metadata (dbmovies) and list entries (movies): list, add or
    update, delete, unmatched files, metadata lookup.'
  name: movies · data
- description: Search the indexers for one movie or a whole group, preview results,
    download a release, clear search history.
  name: movies · search
- description: Start jobs for one or all movie groups and refresh movie metadata.
  name: movies · jobs
- description: 'Series metadata (dbseries) and list entries (series): list, add or
    update, delete, unmatched files, metadata lookup.'
  name: series · data
- description: 'Episodes: metadata (dbserie_episodes) and list entries (serie_episodes)
    - list, add or update, delete.'
  name: series · episodes
- description: Search the indexers for a series, season or episode (normal or RSS),
    preview results, download a release, clear search history.
  name: series · search
- description: Start jobs for one or all series groups and refresh series metadata.
  name: series · jobs
- description: 'Album metadata (dbalbums) and list entries (albums): list and delete.'
  name: music · data
- description: 'Artists: list them, import an artist into a list, discover series
    albums.'
  name: music · artists
- description: Search the indexers for one album, a group or its artists, preview
    results, clear search history.
  name: music · search
- description: Start jobs for one or all music groups, feeds date import, refresh
    album metadata.
  name: music · jobs
- description: Rewrite the audio tags of one album, an artist or all albums.
  name: music · tags
- description: 'Book metadata (dbbooks) and list entries (books): list and delete.'
  name: books · data
- description: Search the indexers for one book, a group or its authors, preview results,
    clear search history.
  name: books · search
- description: Start jobs for one or all book groups, feeds date import, refresh book
    metadata.
  name: books · jobs
- description: 'Audiobook metadata (dbaudiobooks) and list entries (audiobooks): list,
    delete, import an author.'
  name: audiobooks · data
- description: Search the indexers for one audiobook, a group or its authors, preview
    results, clear search history.
  name: audiobooks · search
- description: Start jobs for one or all audiobook groups and refresh audiobook metadata.
  name: audiobooks · jobs
- description: Rewrite the audio tags of one audiobook, an author or all audiobooks.
  name: audiobooks · tags
- description: Jobs waiting in or running from the job queue, the job history, and
    cancelling a queued job.
  name: queue
- description: 'Scheduled jobs: list them, pause or resume all or one, or run one
    now.'
  name: scheduler
- description: Read, change, reload and delete configuration entries.
  name: config
- description: Quality rows (resolution, source, codec, audio) and the priorities
    of each quality profile.
  name: quality
- description: 'In-memory caches: list, rebuild, clear, add and remove entries.'
  name: cache
- description: 'Database maintenance: backup, integrity check, vacuum, cleanup, row
    deletes, slugs and the IMDB database.'
  name: database
- description: 'Organizer tools: test the naming template, organize a folder, and
    match an album folder to a release.'
  name: organize
- description: Parse a release name or file the way the searcher and organizer do.
  name: parse
- description: Trakt authorization and reading a Trakt user list.
  name: trakt
- description: Library, download and worker statistics, and Go runtime statistics.
  name: statistics
- description: 'Used by the web interface: these need a login session (and for POST
    the CSRF token) instead of the apikey, so they cannot be called from Swagger,
    curl or scripts.'
  name: web-only
