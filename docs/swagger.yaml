        name: name
        required: true
        type: string
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Queued as a background job
          schema:
            $ref: '#/definitions/api.Jsonstarted'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
        "404":
          description: Media group or list not found
          schema:
            $ref: '#/definitions/api.Jsonnotfound'
        "409":
          description: The job is already queued
          schema:
            $ref: '#/definitions/api.Jsonconflict'
        "500":
          description: The job could not be queued
          schema:
            $ref: '#/definitions/api.Jsonservererror'
      summary: Clear the download history of a group or list
      tags:
      - music · search
  /api/music/search/history/clearid/{id}:
    get:
      description: Deletes all download history rows of one album list entry, so its
        releases can be downloaded again. Returns the number of deleted rows.
      parameters:
      - description: albums (list entry) ID
        in: path
        name: id
        required: true
        type: integer
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Number of deleted history rows
          schema:
            $ref: '#/definitions/api.Jsoncount'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
        "403":
          description: Database error
          schema:
            $ref: '#/definitions/api.Jsonforbidden'
      summary: Clear the download history of an album
      tags:
      - music · search
  /api/music/search/list/{id}:
    get:
      description: 'Searches the indexers for one album list entry and waits for the
        result: returns the accepted and denied releases with the reasons. download=true
        also downloads the best accepted release.'
      parameters:
      - description: albums (list entry) ID
        in: path
        name: id
        required: true
        type: integer
      - description: 'true: also search by title'
        in: query
        name: searchByTitle
        type: string
      - description: 'true: download the best accepted release'
        in: query
        name: download
        type: boolean
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Releases the indexers returned, split into accepted and denied
            with the reason
          schema:
            $ref: '#/definitions/api.Jsonresults'
        "204":
          description: Nothing Done - no media group or nothing to search (no body)
        "400":
          description: Invalid id
          schema:
            $ref: '#/definitions/api.Jsonbadrequest'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
        "404":
          description: failed with <search error> (plain JSON string)
          schema:
            type: string
      summary: Search an album and show the results
      tags:
      - music · search
  /api/music/search/missing/{name}:
    get:
      description: Queues an incremental search for the missing albums of a music
        group; accepted releases are downloaded. Returns immediately; the work runs
        in the job queue.
      parameters:
      - description: Media group name, or the name of one of its lists (the whole
          group is processed)
        in: path
        name: name
        required: true
        type: string
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Search queued; the text names the list
          schema:
            $ref: '#/definitions/api.Jsonsearchstarted'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
        "404":
          description: Media group or list not found
          schema:
            $ref: '#/definitions/api.Jsonnotfound'
        "409":
          description: The job is already queued
          schema:
            $ref: '#/definitions/api.Jsonconflict'
        "500":
          description: The job could not be queued
          schema:
            $ref: '#/definitions/api.Jsonservererror'
      summary: Search missing albums of a group
      tags:
      - music · search
  /api/music/tag/{id}:
    get:
      description: Queues rewriting the audio tags of the album's files from the stored
        metadata (no new matching). Returns immediately; the work runs in the job
        queue.
      parameters:
      - description: ID of the album in the dbalbums table
