  config.ImdbConfig:
    properties:
      ImdbIDSize:
        description: |-
          ImdbIDSize is an integer specifying the number of expected entries in the IMDb database
          Default is 12000000
        type: integer
      Indexedlanguages:
        description: |-
          Indexedlanguages is an array of strings specifying the languages to use for titles
