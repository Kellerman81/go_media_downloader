info:
  contact: {}
  title: Go Media Downloader API
  version: "1.0"
paths:
  /api/admin:
    get:
      description: 'Returns the dashboard of the web interface as HTML; opens the
        setup wizard while the configuration still has its initial placeholders. Web
        interface only: needs a login session cookie from /api/login and does not
        accept the apikey, so it cannot be called from Swagger or with ?apikey=.'
      responses:
        "200":
          description: HTML content
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Jsonerror'
      summary: '[Web only] Web interface (HTML)'
      tags:
      - web-only
  /api/admin/statistics:
    get:
      description: 'Returns the statistics dashboard of the web interface as HTML.
        Web interface only: needs a login session cookie from /api/login and does
        not accept the apikey, so it cannot be called from Swagger or with ?apikey=.'
      produces:
      - text/html
      responses:
        "200":
          description: Statistics dashboard HTML
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: '[Web only] Statistics page (HTML)'
      tags:
      - web-only
  /api/admin/table/{name}/delete/{index}:
    post:
      description: 'Deletes a row of a database table from the web interface''s table
        editor. Web interface only: needs a login session cookie from /api/login plus
        the session''s CSRF token (X-CSRF-Token header), and does not accept the apikey,
        so it cannot be called from Swagger or with ?apikey=.'
      parameters:
      - description: Database table, e.g. qualities or movies
        in: path
        name: name
        required: true
        type: string
      - description: Value of the id column of the row
        in: path
        name: index
        required: true
        type: integer
      responses:
        "200":
          description: Result of the delete
          schema:
            $ref: '#/definitions/api.Jsonoperation'
        "400":
          description: '{''success'':false,''error'':''invalid index''}'
          schema:
            $ref: '#/definitions/api.Jsonoperation'
      summary: '[Web only] Delete a table row (web interface)'
      tags:
      - web-only
  /api/admin/table/{name}/insert:
    post:
      description: 'Inserts a row into a database table from the web interface''s
        table editor (form or JSON). Web interface only: needs a login session cookie
        from /api/login plus the session''s CSRF token (X-CSRF-Token header), and
        does not accept the apikey, so it cannot be called from Swagger or with ?apikey=.'
      parameters:
      - description: Database table, e.g. qualities or movies
        in: path
        name: name
        required: true
        type: string
      - description: Column values of the row as JSON object, or form fields named
          field-<column>
        in: body
        name: data
        required: true
        schema:
          additionalProperties: true
          type: object
      responses:
        "200":
          description: Result of the insert
          schema:
            $ref: '#/definitions/api.Jsonoperation'
        "400":
          description: '{''success'':false,''error'':''...''}'
          schema:
            $ref: '#/definitions/api.Jsonoperation'
      summary: '[Web only] Insert a table row (web interface)'
      tags:
      - web-only
  /api/admin/table/{name}/update/{index}:
    post:
      description: 'Updates a row of a database table from the web interface''s table
        editor. Web interface only: needs a login session cookie from /api/login plus
        the session''s CSRF token (X-CSRF-Token header), and does not accept the apikey,
        so it cannot be called from Swagger or with ?apikey=.'
      parameters:
      - description: Database table, e.g. qualities or movies
        in: path
        name: name
        required: true
        type: string
      - description: Value of the id column of the row
        in: path
        name: index
        required: true
        type: integer
      - description: Column values of the row as JSON object, or form fields named
          field-<column>
        in: body
        name: data
        required: true
        schema:
          additionalProperties: true
          type: object
      responses:
        "200":
          description: Result of the update
          schema:
            $ref: '#/definitions/api.Jsonoperation'
        "400":
          description: '{''success'':false,''error'':''...''}'
          schema:
            $ref: '#/definitions/api.Jsonoperation'
      summary: '[Web only] Update a table row (web interface)'
      tags:
      - web-only
  /api/album/force-match:
    post:
      description: Matches a music or audiobook folder against the given MusicBrainz
        release ID or Audible ASIN instead of searching. With preview it returns the
        rename plan; otherwise it organizes the folder.
      parameters:
      - description: Album folder, media group, paths and the release ID to match
          it to (forced_id); preview=true only shows the result
        in: body
        name: config
        required: true
        schema:
          $ref: '#/definitions/api.apiAlbumForceMatchJSON'
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Preview, or the result when apply=true
          schema:
            $ref: '#/definitions/structure.AlbumForceMatchPreview'
        "400":
          description: Invalid group type, config or folder, or the match failed
          schema:
            $ref: '#/definitions/api.Jsonbadrequest'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
      summary: Organize an album folder with a given release
      tags:
      - organize
  /api/all/data:
    get:
      description: 'Runs the data scan for every media group: scans the library paths
        for new, changed and removed files and updates the file tables. The request
        waits until all scans are finished and then returns ok.'
      parameters:
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Jobs queued for every media group
          schema:
            $ref: '#/definitions/api.Jsonok'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
      summary: Scan all library folders
      tags:
      - all
  /api/all/feeds:
    get:
      description: 'Runs the feeds job for every list of every configured media group:
        new entries from IMDB, Trakt, TMDB, RSS and the other list types are added
        to the database. The request waits until all imports are finished and then
        returns ok.'
      parameters:
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Jobs queued for every media group
          schema:
            $ref: '#/definitions/api.Jsonok'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
      summary: Import all lists of every media group
      tags:
      - all
  /api/all/search/missing/full:
    get:
      description: Searches the indexers for every missing item of every media group
        and downloads accepted releases. Can take a long time and use many indexer
        calls. The request waits until finished and then returns ok.
      parameters:
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Jobs queued for every media group
          schema:
            $ref: '#/definitions/api.Jsonok'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
      summary: Search all missing items (full)
      tags:
      - all
  /api/all/search/missing/inc:
    get:
      description: Searches the indexers for the missing items of every media group
        that were not searched recently (incremental batch) and downloads accepted
        releases. The request waits until finished and then returns ok.
      parameters:
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Jobs queued for every media group
          schema:
            $ref: '#/definitions/api.Jsonok'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
      summary: Search missing items (incremental)
      tags:
      - all
  /api/all/search/rss:
    get:
      description: Reads the RSS feeds of the indexers of every media group and downloads
        accepted releases for missing items and upgrades. The request waits until
        all searches are finished and then returns ok.
      parameters:
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Jobs queued for every media group
          schema:
            $ref: '#/definitions/api.Jsonok'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
      summary: RSS search for every media group
      tags:
      - all
  /api/all/search/upgrade/full:
    get:
      description: Searches the indexers for better releases of every item below its
        quality cutoff, in every media group, and downloads accepted upgrades. Can
        take a long time. The request waits until finished and then returns ok.
      parameters:
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Jobs queued for every media group
          schema:
            $ref: '#/definitions/api.Jsonok'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
      summary: Search all upgrades (full)
      tags:
      - all
  /api/all/search/upgrade/inc:
    get:
      description: Searches the indexers for better releases of items below their
        quality cutoff that were not searched recently (incremental batch), in every
        media group. The request waits until finished and then returns ok.
      parameters:
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: Jobs queued for every media group
          schema:
            $ref: '#/definitions/api.Jsonok'
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
      summary: Search upgrades (incremental)
      tags:
      - all
  /api/audiobooks:
    get:
      description: Returns the audiobooks of the dbaudiobooks table (metadata independent
        of lists), paginated, with the total count.
      parameters:
      - description: Rows per page (default 100, max 1000)
        in: query
        name: limit
        type: integer
      - description: Page number, starting at 1; only used together with limit
        in: query
        name: page
        type: integer
      - description: 'Sort order: column names with optional asc/desc, e.g. ''id desc''
          or ''year desc, title'''
        in: query
        name: order
        type: string
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
        "200":
          description: One page of rows and the total row count
          schema:
            allOf:
            - $ref: '#/definitions/api.Jsondatarows'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/database.Dbaudiobook'
                  type: array
              type: object
        "401":
          description: Missing or wrong apikey
          schema:
            $ref: '#/definitions/api.Jsonunauthorized'
      summary: List audiobooks (metadata)
      tags:
      - audiobooks · data
  /api/audiobooks/{id}:
    delete:
      description: Deletes one audiobook list entry and its file rows. Files on disk
        are not touched.
      parameters:
      - description: audiobooks (list entry) ID
        in: path
        name: id
        required: true
        type: integer
      - description: 'API key: the webapikey setting from [general] in config.toml'
        in: query
        name: apikey
        required: true
        type: string
      responses:
